name: Refresh daily archive

on:
  schedule:
    # UTC+8 midnight, with a later retry if GitHub delays the first run.
    - cron: "15 16,4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-archive-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Advance archive date
        run: node scripts/refresh-archive.mjs
      - name: Validate the new day's export
        run: npm test && npm run build && npm run check:functions
      - name: Trigger the existing Cloudflare Pages Git deployment
        run: |
          if git diff --quiet -- public/data/archive-build.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/archive-build.json
          git commit -m "chore: refresh daily archive"
          git push origin HEAD:main
